name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --onedir --windowed --noupx --clean --icon=app.ico --version-file=version.txt CAN_Auto_Converter_Tool.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CAN-Converter-EXE
        path: dist/CAN_Auto_Converter_Tool/
